# Production-конфиг Apache для hardgrizz.art (этот сервер).
# Устанавливается в /etc/apache2/sites-available/comic.conf скриптом
# ~/piokurort/deploy/scripts/setup-logging.sh (или вручную).
# Шаблон с placeholder-путями для других машин — config/apache.conf.

<VirtualHost *:80>
    ServerName "hardgrizz.art"
    ServerAlias "www.hardgrizz.art"
    Redirect permanent / https://hardgrizz.art/
</VirtualHost>

<VirtualHost *:443>
    ServerName "hardgrizz.art"
    ServerAlias "www.hardgrizz.art"

    # --- Настройки SSL ---
    SSLEngine On
    SSLCertificateFile      /etc/letsencrypt/live/hardgrizz.art/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/hardgrizz.art/privkey.pem

    DocumentRoot /home/alexej/polina_site/static
    <Directory /home/alexej/polina_site/static>
        Require all granted
        FallbackResource /index.html
    </Directory>

    AliasMatch "^/(comics|arts|characters)/(.*)$" "/data/COMICS_SITE/$1/$2"

    <DirectoryMatch "^/data/COMICS_SITE/(comics|arts|characters)(/|$)">
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 5 minutes"
        Header set Cache-Control "public, max-age=300, must-revalidate"
    </DirectoryMatch>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    # Отдельные логи сайта; ротация — /etc/logrotate.d/apache2
    # (см. ~/piokurort/deploy/logging/apache2.logrotate).
    ErrorLog  ${APACHE_LOG_DIR}/comic-error.log
    CustomLog ${APACHE_LOG_DIR}/comic-access.log combined
</VirtualHost>

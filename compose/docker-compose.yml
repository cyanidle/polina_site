# DDNS для зоны hardgrizz.art.
# Сертификаты и их продление живут отдельно (scripts/setup-certs.sh
# и scripts/setup-renewal.sh) и общие для всех сайтов на машине.

services:
  ddns:
    container_name: ddns
    image: oznu/cloudflare-ddns:latest
    restart: always
    environment:
      - API_KEY=${CF_API_KEY}
      - ZONE=hardgrizz.art
      - PROXIED=false
      - RRTYPE=A
      - DELETE_ON_STOP=false
      - DNS_SERVER=1.1.1.1
